<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL AND CODE — Presensi & Galeri Laporan</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-bottom: 2rem;
        }

        /* Date Controller Styles */
        .date-controller-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent-indigo);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }
        
        .btn-date-nav {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-date-nav:hover {
            background: var(--accent-indigo);
            color: #fff;
        }

        .date-picker-input {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 1px;
        }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            margin-left: 0.5rem;
        }

        /* Form Inputs */
        .input-group { margin-bottom: 1.5rem; }
        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 0.85rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, textarea:focus { border-color: var(--accent-indigo); }
        textarea { height: 90px; resize: vertical; }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-indigo) 0%, #4f46e5 100%);
            color: #fff;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn-action:hover { filter: brightness(1.1); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }

        .badge-status {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .status-belum { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-sudah { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }

        /* Style Galeri Laporan (Dropdown/Accordion) */
        .report-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .report-details {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .report-details.is-mine {
            border-color: var(--accent-indigo);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .report-summary {
            padding: 1.25rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            list-style: none;
            outline: none;
        }
        
        .report-summary::-webkit-details-marker { display: none; }
        .report-summary:hover { background: rgba(255, 255, 255, 0.03); }

        .report-body {
            padding: 0 1.25rem 1.25rem 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 0.5rem;
            padding-top: 1rem;
        }

        .report-user {
            font-weight: 800;
            color: var(--accent-blue);
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .report-content { margin-bottom: 0.75rem; }
        .report-label { font-size: 0.75rem; color: var(--accent-amber); font-weight: 700; text-transform: uppercase; }
        .report-text { font-size: 0.9rem; color: #e2e8f0; margin: 0.2rem 0 0 0; }

        .btn-edit-shortcut {
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent-indigo);
            border: 1px solid var(--accent-indigo);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }
        
        .btn-edit-shortcut:hover {
            background: var(--accent-indigo);
            color: #fff;
        }

        .hidden { display: none !important; }
    
        /* Styling untuk Logo/Ikon Header Baru */
        .header-logo-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px; /* Membuat sudut melengkung */
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .header-logo-btn img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .header-logo-btn:hover {
            background: rgba(56, 189, 248, 0.15); /* Efek cahaya biru saat di-hover */
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 15px; /* Jarak antara ikon dan teks judul */
        }

    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="header-title-wrapper">
                <!-- Tombol Ikon Baru -->
                <a href="media_collect.html" class="header-logo-btn" title="Buka Media Collect">
                    <img src="https://cdn-icons-png.flaticon.com/512/1527/1527488.png" alt="Media Collect Icon">
                </a>
                
                <!-- Teks Judul -->
                <div>
                    <h1>
                        <a href="akun-sosmed.html" style="color: inherit; text-decoration: none; transition: color 0.3s;" onmouseover="this.style.color='var(--accent-blue)'" onmouseout="this.style.color='inherit'" title="Kelola Akun Sosmed">PIXEL</a> 
                        AND CODE — Presensi & Laporan
                    </h1>
                    <p style="margin:0; font-size:0.85rem; color: var(--text-secondary);">Isi laporanmu, pantau progress tim secara real-time.</p>
                </div>
            </div>
            
            <button class="btn-back hidden" id="btnLogout" onclick="window.logout()">Keluar Akun</button>
        </header>

        <!-- HALAMAN LOGIN -->
        <div id="loginSection" class="card" style="max-width: 400px; margin: 0 auto; text-align: center;">
            <h2 style="margin-top:0;">Autentikasi Anggota</h2>
            <form onsubmit="window.handleLogin(event)">
                <div class="input-group" style="text-align: left;">
                    <label>Username</label>
                    <input type="text" id="in-user" required autocomplete="off" placeholder="Masukkan username">
                </div>
                <div class="input-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="in-pass" required placeholder="Masukkan password">
                </div>
                <button type="submit" id="btnLoginSubmit" class="btn-action">Masuk 🚀</button>
            </form>
        </div>

        <!-- DASHBOARD (FORM & GALERI) -->
        <div id="dashboardSection" class="hidden">
            
            <!-- PANEL KENDALI WAKTU (KALENDER) -->
            <div class="date-controller-wrapper">
                <button type="button" onclick="window.changeDate(-1)" class="btn-date-nav">◀ Prev</button>
                <div style="text-align: center; display:flex; flex-direction:column; align-items:center;">
                    <div id="displayDateText" style="font-size: 0.85rem; color: var(--accent-green); margin-bottom: 0.2rem; font-weight:bold;"></div>
                    <input type="date" id="masterDate" class="date-picker-input" onchange="window.onDateChange()">
                </div>
                <button type="button" onclick="window.changeDate(1)" class="btn-date-nav">Next ▶</button>
            </div>

            <!-- FORM INPUT MILIK USER -->
            <div class="card">
                <h2 style="margin-top:0;">Halo, <span id="displayName" style="color: var(--accent-blue);"></span>! 👋</h2>
                <div id="statusBadge" class="badge-status status-belum">⏳ Memeriksa data...</div>
                
                <form id="reportForm" onsubmit="window.saveReport(event)">
                    <div class="input-group">
                        <label>📝 Summary (Apa yang kamu kerjakan di tanggal ini?)</label>
                        <textarea id="valSummary" required></textarea>
                    </div>
                    <div class="input-group">
                        <label>🎯 Next to do (Apa targetmu selanjutnya?)</label>
                        <textarea id="valNext" required></textarea>
                    </div>
                    <div class="input-group">
                        <label>💡 Feedback to Mentor (Ada kendala?)</label>
                        <textarea id="valFeedback" required></textarea>
                    </div>
                    <div id="timestampDisplay" style="font-size:0.8rem; color:var(--accent-green); margin-bottom:1rem;" class="hidden"></div>
                    <button type="submit" id="btnSubmit" class="btn-action">Kirim Laporan Harian</button>
                </form>
            </div>

            <!-- GALERI SEMUA LAPORAN -->
            <div class="card">
                <h2 style="margin-top:0; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                    📡 Galeri Laporan Tim
                </h2>
                <div id="galeri-laporan-container" class="report-grid">
                    <p style="color: var(--text-secondary); text-align: center;">Memuat data publik...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, child } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyBvY2ryMzSJjgHkadfuPWbzFBgL1kQpygI",
            authDomain: "materi-pnc.firebaseapp.com",
            databaseURL: "https://materi-pnc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "materi-pnc",
            storageBucket: "materi-pnc.firebasestorage.app",
            messagingSenderId: "631396189340",
            appId: "1:631396189340:web:c9b86c3f7face5b1635959",
            measurementId: "G-21R2MTPGQ4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const APPS_SCRIPT_AUTH_URL = "https://script.google.com/macros/s/AKfycbzexbZuGm306_9yNbTn2NkDaEebOikc2oeR76F2K-Tm6JCjJxeHKo4GLu3pzjpDBmA0qg/exec";

        let currentUser = sessionStorage.getItem('pnc_session_user') || null;
        let currentDateView = new Date(); 

        function formatDateToKey(d) {
            return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
        }

        function updateDateUI() {
            const key = formatDateToKey(currentDateView);
            document.getElementById('masterDate').value = key;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('displayDateText').innerText = currentDateView.toLocaleDateString('id-ID', options);
        }

        window.initApp = async function() {
            if (currentUser) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('btnLogout').classList.remove('hidden');
                
                const namaTampil = currentUser.charAt(0).toUpperCase() + currentUser.slice(1);
                document.getElementById('displayName').innerText = namaTampil;
                
                currentDateView = new Date(); 
                updateDateUI();
                await window.muatDataPribadiDanGaleri();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('btnLogout').classList.add('hidden');
            }
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            const u = document.getElementById('in-user').value.trim().toLowerCase();
            const p = document.getElementById('in-pass').value;
            const btnLogin = document.getElementById('btnLoginSubmit');

            btnLogin.disabled = true;
            btnLogin.innerText = "⏳ Verifikasi Kredensial...";

            try {
                const response = await fetch(APPS_SCRIPT_AUTH_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "login", username: u, password: p })
                });
                
                const result = await response.json();

                if (result.status === "success") {
                    sessionStorage.setItem('pnc_session_user', u);
                    currentUser = u;
                    window.initApp();
                } else {
                    alert("❌ " + (result.message || "Username atau Password salah!"));
                }
            } catch (err) {
                alert("❌ Terjadi kesalahan koneksi ke server autentikasi.");
                console.error(err);
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = "Masuk 🚀";
            }
        }

        window.logout = function() {
            sessionStorage.removeItem('pnc_session_user');
            currentUser = null;
            document.getElementById('in-user').value = "";
            document.getElementById('in-pass').value = "";
            window.initApp();
        }

        window.changeDate = async function(offset) {
            currentDateView.setDate(currentDateView.getDate() + offset);
            updateDateUI();
            await window.muatDataPribadiDanGaleri();
        }

        window.onDateChange = async function() {
            const val = document.getElementById('masterDate').value;
            if(val) {
                currentDateView = new Date(val + "T00:00:00"); 
                updateDateUI();
                await window.muatDataPribadiDanGaleri();
            }
        }

        window.muatDataPribadiDanGaleri = async function() {
            const dateKey = document.getElementById('masterDate').value;
            const dbRef = ref(db);
            const containerGaleri = document.getElementById('galeri-laporan-container');
            const badge = document.getElementById('statusBadge');
            const btnSubmit = document.getElementById('btnSubmit');
            const timeInfo = document.getElementById('timestampDisplay');

            try {
                const snapshot = await get(child(dbRef, `daily_reports/${dateKey}`));
                containerGaleri.innerHTML = ""; 
                
                let dataPribadiAda = false;

                if (snapshot.exists()) {
                    const semuaLaporan = snapshot.val();
                    
                    Object.keys(semuaLaporan).forEach(username => {
                        const laporan = semuaLaporan[username];
                        const isMine = (username === currentUser);
                        
                        let editButtonHTML = "";
                        let replyHTML = ""; // Variabel baru untuk menampung elemen UI Reply

                        if (isMine) {
                            dataPribadiAda = true;
                            document.getElementById('valSummary').value = laporan.summary;
                            document.getElementById('valNext').value = laporan.nextToDo;
                            document.getElementById('valFeedback').value = laporan.feedback;
                            
                            badge.className = "badge-status status-sudah";
                            badge.innerHTML = "✅ Kamu sudah mengisi laporan untuk tanggal ini";
                            btnSubmit.innerText = "Perbarui (Update) Laporan";
                            btnSubmit.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
                            timeInfo.innerText = "Terakhir disimpan: " + laporan.datetime;
                            timeInfo.classList.remove('hidden');

                            editButtonHTML = `<button type="button" onclick="window.scrollToForm()" class="btn-edit-shortcut">✏️ Edit Laporanku</button>`;
                        }

                        // --- LOGIKA PENAMBAHAN FITUR REPLY MULAI DI SINI ---
                        if (laporan.reply) {
                            // Jika sudah ada balasan, tampilkan balasannya di dalam kotak khusus
                            replyHTML = `
                            <div class="report-content" style="background: rgba(99, 102, 241, 0.1); padding: 12px; border-left: 3px solid var(--accent-indigo); border-radius: 4px; margin-top: 15px;">
                                <div class="report-label" style="color: var(--accent-indigo);">↪ Reply from ${laporan.replyBy || 'Mentor'}</div>
                                <p class="report-text" style="color: #fff; font-weight: 500;">${laporan.reply}</p>
                            </div>`;
                        } else if (!isMine) {
                            // Jika belum ada balasan, dan yang melihat saat ini BUKAN pemilik laporan
                            // Maka tampilkan textarea untuk memberikan balasan
                            replyHTML = `
                            <div style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 10px;">
                                <textarea id="reply-text-${username}" placeholder="Berikan feedback atau arahan untuk ${username}..." style="width: 100%; height: 60px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 6px; margin-bottom: 8px; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
                                <button type="button" onclick="window.kirimReply('${username}', '${dateKey}')" class="btn-edit-shortcut" style="background: var(--accent-indigo); color: white; border: none; padding: 0.5rem 1rem;">Kirim Reply</button>
                            </div>`;
                        }
                        // --- LOGIKA PENAMBAHAN FITUR REPLY SELESAI ---

                        containerGaleri.innerHTML += `
                            <details class="report-details ${isMine ? 'is-mine' : ''}" ${isMine ? 'open' : ''}>
                                <summary class="report-summary">
                                    <div>
                                        <span class="report-user">${username}</span> 
                                        ${isMine ? '<span style="font-size:0.7rem; color:var(--accent-green); margin-left:5px;">(Laporanmu)</span>' : ''}
                                    </div>
                                    <div style="font-size: 0.8rem; color: var(--text-secondary); font-weight: normal;">
                                        🕒 ${laporan.datetime.split(',')[1] || laporan.datetime} ▾
                                    </div>
                                </summary>
                                <div class="report-body">
                                    <div class="report-content">
                                        <div class="report-label">📝 Summary</div>
                                        <p class="report-text">${laporan.summary}</p>
                                    </div>
                                    <div class="report-content">
                                        <div class="report-label">🎯 Next to do</div>
                                        <p class="report-text">${laporan.nextToDo}</p>
                                    </div>
                                    <div class="report-content">
                                        <div class="report-label">💡 Feedback</div>
                                        <p class="report-text">${laporan.feedback}</p>
                                    </div>
                                    ${editButtonHTML}
                                    ${replyHTML} <!-- Variabel reply disisipkan di sini -->
                                </div>
                            </details>
                        `;
                    });
                } 
                
                if (!dataPribadiAda) {
                    document.getElementById('reportForm').reset();
                    badge.className = "badge-status status-belum";
                    badge.innerHTML = "⏳ Belum mengisi laporan di tanggal ini";
                    btnSubmit.innerText = "Kirim Laporan";
                    btnSubmit.style.background = "linear-gradient(135deg, var(--accent-indigo) 0%, #4f46e5 100%)";
                    timeInfo.classList.add('hidden');
                }

                if (containerGaleri.innerHTML === "") {
                    containerGaleri.innerHTML = "<p style='color: var(--text-secondary); text-align: center;'>Belum ada laporan di tanggal ini.</p>";
                }

            } catch (error) {
                console.error(error);
                badge.innerHTML = "⚠️ Gagal terhubung ke database.";
            }
        }

        window.saveReport = async function(e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ Menyimpan...";

            const dateKey = document.getElementById('masterDate').value; 
            const sumText = document.getElementById('valSummary').value;
            const nextText = document.getElementById('valNext').value;
            const fbText = document.getElementById('valFeedback').value;
            
            const now = new Date();
            const waktu = now.toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', dateStyle: 'medium', timeStyle: 'short' }); 

            try {
                // 1. Simpan ke Firebase Realtime Database untuk tampilan website (Fast Loading)
                await set(ref(db, `daily_reports/${dateKey}/${currentUser}`), {
                    summary: sumText,
                    nextToDo: nextText,
                    feedback: fbText,
                    datetime: waktu,
                    timestamp: now.getTime()
                });

                // 2. Cek Disiplin Waktu Pelaporan
                // Jika tanggal laporan (dateKey) sama dengan hari ini, maka Tepat Waktu.
                // Jika berbeda (misal ngisi untuk tanggal kemarin), maka Terlambat (Backfill).
                const today = new Date();
                const todayKey = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, '0') + "-" + String(today.getDate()).padStart(2, '0');
                const statusDisiplin = (dateKey === todayKey) ? "Tepat Waktu" : "Terlambat (Backfill)";

                // 3. Sinkronisasi Data ke Google Sheets (Log_Laporan) untuk rekapitulasi jangka panjang
                // APPS_SCRIPT_AUTH_URL sudah dideklarasikan di awal script Anda
                fetch(APPS_SCRIPT_AUTH_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "syncReport",
                        tanggal: dateKey,
                        timestamp: waktu,
                        username: currentUser,
                        summary: sumText,
                        next: nextText,
                        feedback: fbText,
                        status_waktu: statusDisiplin,
                        is_reply_only: false // Ini bukan aksi reply, tapi submit laporan utama
                    })
                });

                alert("✅ Laporan berhasil disimpan!");
                await window.muatDataPribadiDanGaleri();
            } catch (error) {
                alert("❌ Gagal menyimpan. Periksa koneksi.");
                console.error("Firebase Error:", error);
            } finally {
                btnSubmit.disabled = false;
            }
        }

        window.scrollToForm = function() {
            document.getElementById('reportForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.getElementById('valSummary').focus();
        }

        window.kirimReply = async function(targetUser, dateKey) {
            const replyText = document.getElementById(`reply-text-${targetUser}`).value;
            if (!replyText.trim()) return alert("⚠️ Isi balasan terlebih dahulu!");

            try {
                // 1. Simpan reply ke Firebase
                await update(ref(db, `daily_reports/${dateKey}/${targetUser}`), {
                    reply: replyText,
                    replyBy: currentUser
                });

                // 2. Sync reply ke Google Sheets (Log_Laporan)
                fetch(APPS_SCRIPT_AUTH_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "syncReport",
                        tanggal: dateKey,
                        username: targetUser,
                        username_reply: currentUser,
                        reply: replyText,
                        is_reply_only: true
                    })
                });

                alert("✅ Reply berhasil dikirim!");
                await window.muatDataPribadiDanGaleri(); // Refresh tampilan galeri
            } catch (error) {
                alert("❌ Gagal mengirim reply. Periksa koneksi.");
                console.error(error);
            }
        }

        window.onload = window.initApp;
    </script>
</body>
</html>
