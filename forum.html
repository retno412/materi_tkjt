<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forum Diskusi Siswa</title>
    <link rel="stylesheet" href="journey.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="screen-container forum-container">
        
        <!-- Header Forum -->
        <header class="dash-header">
            <h1 class="pixel-font text-glow" style="font-size: 2.5rem;">FORUM_&lt;DISKUSI&gt;</h1>
            <p class="code-font small-text">Tempat Saling Bantu, Tanya Jawab, & Kolaborasi anak IT</p>
            <button class="btn pixel-btn" style="padding: 8px; font-size: 1rem; width: auto;" onclick="window.location.href='journey.html'">[ KEMBALI KE JOURNEY ]</button>
        </header>

        <!-- Form Input Diskusi Baru -->
        <div class="forum-input-box">
            <textarea id="forum-msg" class="code-font" rows="2" placeholder="Tulis pertanyaan atau kendala kodingmu di sini..."></textarea>
            <button class="btn pixel-btn" style="margin: 0; font-size: 1rem;" onclick="postToForum('MAIN', 'POST')">[ KIRIM DISKUSI ]</button>
        </div>

        <!-- Daftar Diskusi (Live dari Spreadsheet) -->
        <div class="forum-feed code-font" id="forum-feed-list">
            <p style="text-align: center; color: #6272a4;">Memuat diskusi dari server...</p>
        </div>

    </div>

    <script src="forum.js"></script>
</body>
</html>
